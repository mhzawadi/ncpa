name: build our image for latest

on:
  push:
    branches: master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: build the image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: mhzawadi/ncpa_builder:latest
          platforms: linux/amd64,linux/arm64,linux/arm/v7
  container-test-job:
      needs: [build]
      runs-on: ubuntu-24.04-arm
      container:
        image: mhzawadi/ncpa_builder
        volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:ro
        options: --cpus 1
      steps:
        - name: Prepare
          id: prepare
          run: |
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "version=${VERSION}"
        - name: Check for dockerenv file
          run: /start.sh
        - uses: ncipollo/release-action@v1
          with:
            artifacts: "/ncpa/build/*.deb"
            body: "View full [changelog](https://github.com/NagiosEnterprises/ncpa/blob/${{ steps.prepare.outputs.version }}/CHANGES.rst) for more information."
